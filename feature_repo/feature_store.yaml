# Feast: file offline store over warehouse/p3/feature_views/*.parquet (written by features/compute.py),
# Redis online store (docker-compose.yml). Run from this folder: `feast apply`.
project: trustissues
provider: local
registry: ../warehouse/p3/feast/registry.db
offline_store:
  type: file
online_store:
  type: redis
  connection_string: "localhost:6379"
entity_key_serialization_version: 3
