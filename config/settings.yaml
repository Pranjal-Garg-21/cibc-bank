# AS_OF_DATE is fixed; code never calls today() (Design §4).
as_of_date: "2026-09-28"

paths:
  # Folder holding data/, schema/, DATA_DICTIONARY.xlsx, files/. Override with MAPLE_DATA_DIR.
  maple_data_dir: maple_data/maple_collections_release
  warehouse_dir: warehouse
  duckdb_file: trustissues.duckdb

identity:
  link_threshold: 0.95      # Splink probability at or above this links automatically
  review_threshold: 0.80    # 0.80-0.95 is the grey zone: linked only if the LLM agrees, else human review
  # Confidence recorded for exact rule links. Rules are deterministic, so this is a stated value, not a score;
  # the measured precision of each rule is in reports/identity_report.md.
  rule_confidence:
    crm_pointer: 1.0        # CRM's own duplicate_of_crm_id
    national_id: 1.0        # same national_id_hash (CRM only)
    cif: 1.0                # deposit src_customer_ref = bureau bank_subject_ref (both the 10-digit CIF)
    name_dob_phone: 0.99
    dob_name_postal: 0.98
  max_crm_per_cluster: 5    # more CRM records than this in one person is a conflict
  max_dob_spread_days: 400  # DOBs further apart than this inside one cluster are "clearly different"
  llm_model: claude-opus-5-5    # second opinion on grey-zone pairs (the plan allows a smaller model for bulk jobs)
  llm_effort: low               # a yes/no judgement on two short records
  llm_workers: 8                # parallel requests
  llm_max_pairs: 6000           # cost guard: pairs beyond this go straight to human review
  llm_prompt_version: identity_pair_v1
  golden_id_digits: 7           # G-0000000: 1M+ people do not fit in 6 digits

ingest:
  # A removed or retyped column stops the load for that source unless listed here.
  allow_missing_columns: {}
  transcript_glob: files/transcripts/*/*/*.json

duckdb:
  # Without a cap DuckDB takes ~80% of RAM and the kernel killed the curated build (transactions, 12M rows) on a
  # 16 GB machine. Beyond the cap DuckDB spills to disk instead of dying. Raise it on a bigger machine.
  memory_limit: 9GB
  threads: 4
  preserve_insertion_order: false   # lets a big CREATE TABLE AS stream and spill instead of buffering the whole result

llm:
  # Every LLM call goes through common/llm.py. Provider, endpoint and models are set here and nowhere else.
  provider: openai_compatible                   # openai_compatible (OpenRouter, NVIDIA, a local server) | anthropic
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY               # name of the environment variable (or .env entry) holding the key
  models:
    # NVIDIA Nemotron 3 Super on OpenRouter. ":free" is the free variant (rate-limited); drop it for the paid one.
    answer: nvidia/nemotron-3-super-120b-a12b:free    # answers a user reads (policy / customer answers)
    bulk: nvidia/nemotron-3-super-120b-a12b:free      # bulk jobs (per-note text features); a smaller model can go here later
  # Nemotron Super "thinks" before it answers. With thinking on, answers took 40-120 s and often ran out of tokens
  # (broken JSON). With it off the same answer took ~10 s. Measured 2026-10-03; "effort: low" was worse.
  extra_body:
    reasoning: {enabled: false}
  max_tokens_cap: 8000                          # a reply cut off at the limit is retried with a doubled limit up to this
  timeout_secs: 120
  max_retries: 3
  cache_file: cache/llm_cache.sqlite            # relative to the warehouse folder; keyed by a hash of the whole request

mapping_assistant:
  # AI column-mapping assistant (factory/curate/mapping_assistant.py). Sends column METADATA only (names, types,
  # descriptions), never data; examples of PII / protected / proxy columns are withheld. Nothing is sent without --call.
  # To be replaced by the team's shared `llm:` section and common/llm.py when that is merged (merge.md).
  base_url: https://openrouter.ai/api/v1         # OpenRouter, OpenAI-compatible chat API
  api_key_env: OPENROUTER_API_KEY                # name of the env variable (or .env entry) holding the key; never the key itself
  model: nvidia/nemotron-3-super-120b-a12b       # NVIDIA Nemotron 3 Super
  extra_body:
    reasoning: {enabled: false}                  # thinking off: a mapping is a short judgement; thinking made replies slow
  temperature: 0
  max_tokens: 4000
  batch_size: 25                                 # columns per request (one table at a time)
  workers: 4                                     # parallel requests
  max_batches: 100                               # cost guard: about 1,400 columns -> ~70 batches
  timeout_secs: 120
  max_retries: 3
  prompt_version: mapping_v1
  cache_file: cache/mapping_llm_cache.jsonl      # relative to the warehouse folder
