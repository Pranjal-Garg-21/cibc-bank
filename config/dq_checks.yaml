    how: "Most of the policy, procedure, script, FAQ and incident documents are written in English only. English is therefore the reference language. A French question is translated to English only to search the documents; the answer is written in French, and the quoted evidence stays in English so it can still be checked word for word."

  - id: M10
    area: missing
    title: "French versions are condensed summaries: sections of the English document are missing from the French one"
    tables: [reference_documents]
    severity: medium
    status: documented
    sql: "select coalesce(sum(len(list_filter(from_json(e.section_ids, '[\"VARCHAR\"]'), x -> not list_contains(from_json(f.section_ids, '[\"VARCHAR\"]'), x)))), 0), coalesce(sum(len(from_json(e.section_ids, '[\"VARCHAR\"]'))), 0) from curated.reference_documents f join curated.reference_documents e on e.language = 'EN' and e.doc_id || '-FR' = f.doc_id where f.language = 'FR'"
    evidence: "select string_agg(doc || ' ' || sec, ', ' order by doc, sec) from (select e.doc_id as doc, unnest(list_filter(from_json(e.section_ids, '[\"VARCHAR\"]'), x -> not list_contains(from_json(f.section_ids, '[\"VARCHAR\"]'), x))) as sec from curated.reference_documents f join curated.reference_documents e on e.language = 'EN' and e.doc_id || '-FR' = f.doc_id where f.language = 'FR')"
    how: "Counted from the section list in the document metadata (total column is the English sections of the two translated documents). The French text is also about a third of the length and drops details inside the sections it keeps (the Sunday 13:00 to 17:00 window, the 30-day contact pause, the 90-day re-review). No number in a French section differs from its English counterpart, so nothing contradicts; the French is only less complete. The French POL-COLL-004 file also has no section 4.1 although its metadata lists one, so 5 sections are missing in practice, not the count above. Handling: English is the reference, and a French rendering of an English document is not searched, so an answer cannot be built from the shorter text. The organisers should confirm that the English version governs."

  # ------------------------------------------------------------------ E. contradictions
  - id: L1
