    tables: [offers]
    severity: medium
    status: documented
    sql: "select count(*) filter (where offer_ts >= date '{as_of}' + 1 or response_ts >= date '{as_of}' + 1), count(*) from curated.offers"
    evidence: "select format('{:,}', count(*) filter (where offer_ts >= date '{as_of}' + 1)) || ' offers are dated after {as_of} (the latest ' || cast(max(offer_ts) as date) || '), and ' || format('{:,}', count(*) filter (where response_ts >= date '{as_of}' + 1)) || ' answers (accepted, declined, considering) are dated after it' from curated.offers"
    how: "Not changed. Treated as not yet known on the snapshot date: the NBA queue counts an offer only if it was made before the as-of date, and its answer and plan status only if the answer came before it (`nba/queue.py` `load_cases`). Otherwise a customer would look as if they had already been offered, or had already broken a plan, when on the as-of date neither had happened."

  # ------------------------------------------------------------------ F. shifts and patterns that affect models
  - id: T1
    area: shift
    title: "Collections cases change abruptly from April 2026: new cases surge, cures barely grow, and the 30-day cure rate falls"
    tables: [collections_cases]
    severity: high
    status: documented
    sql: "select count(*) filter (where case_open_date >= '2026-04-01'), count(*) from curated.collections_cases"
    evidence: "select 'cases opened: ' || format('{:,}', count(*) filter (where case_open_date >= '2026-03-01' and case_open_date < '2026-04-01')) || ' in Mar 2026, ' || format('{:,}', count(*) filter (where case_open_date >= '2026-04-01' and case_open_date < '2026-05-01')) || ' in Apr, ' || format('{:,}', count(*) filter (where case_open_date >= '2026-08-01' and case_open_date < '2026-09-01')) || ' in Aug. Cases paid up per month only move between ' || (select format('{:,}', min(k)) || ' and ' || format('{:,}', max(k)) from (select count(*) k from curated.collections_cases where cure_date >= '2026-04-01' and cure_date < '2026-09-01' group by date_trunc('month', cure_date))) || ' from Apr to Aug. Paid up within 30 days of opening: ' || round(100 * avg(case when cure_date <= case_open_date + 30 then 1.0 else 0.0 end) filter (where case_open_date >= '2025-10-01' and case_open_date < '2026-04-01'), 1) || '% of cases opened Oct 2025 to Mar 2026, ' || round(100 * avg(case when cure_date <= case_open_date + 30 then 1.0 else 0.0 end) filter (where case_open_date >= '2026-04-01' and case_open_date < '2026-05-01'), 1) || '% in Apr, ' || round(100 * avg(case when cure_date <= case_open_date + 30 then 1.0 else 0.0 end) filter (where case_open_date >= '2026-07-01' and case_open_date < '2026-08-01'), 1) || '% in Jul 2026. Cases opened in Apr 2026 that ended charged off, in legal, on insolvency hold or with an agency: ' || format('{:,}', count(*) filter (where case_open_date >= '2026-04-01' and case_open_date < '2026-05-01' and case_status not in ('open', 'cured', 'closed_paid', 'settled'))) || ', against ' || cast(round(count(*) filter (where case_open_date >= '2025-10-01' and case_open_date < '2026-04-01' and case_status not in ('open', 'cured', 'closed_paid', 'settled')) / 6.0) as int) || ' a month for Oct 2025 to Mar 2026. Before Apr 2026 the history looks fully settled: ' || count(*) filter (where case_open_date < '2026-04-01' and case_status = 'open') || ' of those cases are still open and ' || round(100 * avg(case when case_status in ('cured', 'closed_paid', 'settled') then 1.0 else 0.0 end) filter (where case_open_date < '2026-04-01'), 1) || '% were paid up' from curated.collections_cases"
    how: "Not changed: the values agree with each other, and no event in the operations log explains the break. Anything trained or measured across Apr 2026 must allow for it: split by time, calibrate on the most recent fully observed months, and do not compare cure or roll rates across the break without saying so. In P3's case model the not-cured rate is 41% in training, 62% in validation and 80% in the holdout, so a model calibrated on earlier months under-predicts; the bank's own `cure_30d` score is badly calibrated after the break too (calibration error 0.25, `reports/model_evaluation.md`). Affected column counts cases opened from Apr 2026."
  - id: T2
    area: shift
    title: "Promise break rate rises from May 2026, mostly because fewer promises are for the full overdue amount"
    tables: [promises_to_pay]
    severity: high
    status: documented
    sql: "select count(*) filter (where ptp_created_ts >= '2026-05-01'), count(*) from curated.promises_to_pay where ptp_status in ('kept', 'broken', 'partially_kept')"
    evidence: "select 'broken or partly kept: ' || round(100 * avg(b) filter (where m < '2026-05-01'), 1) || '% of promises made Jan 2025 to Apr 2026, then ' || round(100 * avg(b) filter (where m = '2026-05-01'), 1) || '% in May, ' || round(100 * avg(b) filter (where m = '2026-06-01'), 1) || '% in Jun and ' || round(100 * avg(b) filter (where m = '2026-08-01'), 1) || '% in Aug 2026. Promises for the full overdue amount: ' || round(100 * avg(f) filter (where m < '2026-05-01'), 1) || '% of them before May, ' || round(100 * avg(f) filter (where m = '2026-08-01'), 1) || '% in Aug. Within each kind the rate moves less: full amount ' || round(100 * avg(b) filter (where m < '2026-05-01' and f = 1), 1) || '% to ' || round(100 * avg(b) filter (where m = '2026-08-01' and f = 1), 1) || '%, part amount ' || round(100 * avg(b) filter (where m < '2026-05-01' and f = 0), 1) || '% to ' || round(100 * avg(b) filter (where m = '2026-08-01' and f = 0), 1) || '%. Average days past due when the promise was made: ' || round(avg(dpd) filter (where m < '2026-05-01'), 1) || ' before May, ' || round(avg(dpd) filter (where m = '2026-08-01'), 1) || ' in Aug' from (select cast(date_trunc('month', ptp_created_ts) as date) m, case when ptp_status = 'kept' then 0.0 else 1.0 end b, case when ptp_to_overdue_ratio >= 0.999 then 1 else 0 end f, dpd_at_creation dpd from curated.promises_to_pay where ptp_status in ('kept', 'broken', 'partially_kept') and ptp_created_ts >= '2025-01-01')"
    how: "Not changed. Most of the rise is a change in mix: promises for the full amount are almost never broken, and they become rarer. The rest comes with promises made later in delinquency. It starts a month after T1. Handle it as T1: time-based splits and calibration on recent months. The certified promise-kept rate for periods after Apr 2026 is not comparable with earlier periods without this note. Affected column counts resolved promises made from May 2026."
  - id: T3
    area: shift
    title: "Outcomes are recorded late: case cures stop before the snapshot date, and some promises stay open after their grace period"
    tables: [collections_cases, promises_to_pay]
    severity: medium
    status: documented
    sql: "select count(*) filter (where ptp_status = 'open' and ptp_due_date + cast(coalesce(grace_days, 0) as integer) < date '{as_of}'), count(*) filter (where ptp_status = 'open') from curated.promises_to_pay"
    evidence: "select 'last case cure recorded on ' || (select max(cure_date) from curated.collections_cases) || ', while other case statuses run to ' || (select max(case_status_date) from curated.collections_cases) || ' and the snapshot is {as_of}; the open promises past their grace period were made in ' || (select string_agg(distinct strftime(ptp_created_ts, '%b %Y'), ', ') from curated.promises_to_pay where ptp_status = 'open' and ptp_due_date + cast(coalesce(grace_days, 0) as integer) < date '{as_of}')"
    how: "Not changed. Use the last fully recorded outcome date (the latest cure date), not the snapshot date, as the end of any outcome window: a case or promise whose window ends after it is unlabelled, not a failure. The P3 training sets already cut their labels there (`features/build_case_training_set.py`, `nba/actions.py`). Affected column counts open promises whose due date plus grace days is before the snapshot date."
  - id: T4
    area: shift
    title: "Every promise for 90% to 99.9% of the overdue amount was broken, while promises for the full amount almost never are"
    tables: [promises_to_pay]
    severity: medium
    status: documented
    sql: "select count(*) filter (where ptp_to_overdue_ratio > 0.9 and ptp_to_overdue_ratio < 0.999), count(*) from curated.promises_to_pay where ptp_status in ('kept', 'broken', 'partially_kept')"
    evidence: "select format('{:,}', count(*) filter (where r = 'near' and ptp_status = 'broken')) || ' of ' || format('{:,}', count(*) filter (where r = 'near')) || ' resolved promises for 90% to 99.9% of the overdue amount were broken (typical shortfall $' || round(median(gap) filter (where r = 'near'), 2) || '); for exactly the full amount ' || round(100 * avg(case when ptp_status = 'kept' then 0.0 else 1.0 end) filter (where r = 'full'), 1) || '% were broken, for 50% to 90% ' || round(100 * avg(case when ptp_status = 'kept' then 0.0 else 1.0 end) filter (where r = 'mid'), 1) || '%. The overdue amount on the promise matches the contact that created it for ' || round(100 * avg(case when matches then 1.0 else 0.0 end) filter (where r = 'near' and matches is not null), 1) || '% of the 90% to 99.9% promises' from (select p.ptp_status, p.overdue_at_creation - p.ptp_amount gap, abs(c.overdue_at_contact - p.overdue_at_creation) < 0.01 matches, case when p.ptp_to_overdue_ratio >= 0.999 then 'full' when p.ptp_to_overdue_ratio > 0.9 then 'near' when p.ptp_to_overdue_ratio > 0.5 then 'mid' else 'low' end r from curated.promises_to_pay p left join curated.contact_history c using (contact_id) where p.ptp_status in ('kept', 'broken', 'partially_kept'))"
    how: "Not changed. Nothing in the data explains why a promise a few dollars short of the full amount should always break, so this is most likely a rule of how the synthetic data was made, not customer behaviour. It is not outcome leakage: both amounts are on record when the promise is made (see evidence). Break-risk models learn it, and it carries much of the P3 promise model's lead over the bank's `ptp_break` (`reports/model_evaluation.md`). Do not present it as a finding about customers."

  # ------------------------------------------------------------------ F. customer identity and the golden record
  # These read the published gold tables, so they report what consumers actually see.
  # Details: docs/identity.md, reports/identity_report.md, docs/consumer_views.md.
  - id: I1
    area: identity
    title: "Source customer that matched nobody (kept as its own person)"
    tables: [customer_xref]
    severity: medium
    status: documented
    sql: "select count(*) filter (where status = 'singleton'), count(*) from gold.customer_xref"
    evidence: "select string_agg(source_system || ' ' || n, ', ' order by n desc) from (select source_system, count(*) n from gold.customer_xref where status = 'singleton' group by 1)"
    how: "Not linked: no rule matched and Splink scored below 0.80, or the record is too thin to compare (3.9% of bureau files have no name). Each keeps its own golden ID so no account is dropped (`gold.customer_xref.status = 'singleton'`). Some are probably missed links, which can be added later; a wrong merge could not be undone."
  - id: I2
    area: identity
    title: "Source customer waiting for a person to decide its match"
    tables: [customer_xref, identity_review_queue]
    severity: medium
    status: review
    sql: "select count(*) filter (where status in ('in_review', 'blocked_conflict', 'unresolved')), count(*) from gold.customer_xref"
    evidence: "select string_agg(status || ' ' || n, ', ' order by n desc) from (select status, count(*) n from gold.customer_xref where status in ('in_review', 'blocked_conflict', 'unresolved') group by 1)"
    how: "Kept separate until decided. The candidate pairs are in `gold.identity_review_queue`, both records side by side with the Splink and LLM reasons. Decisions go in `data/review/identity_decisions.csv` and are re-applied on every run. `c360_customer.dq_status = 'identity_in_review'` marks the people affected."
  - id: I3
    area: identity
    title: "Candidate match pair in the human review queue"
    tables: [identity_review_queue]
    severity: medium
    status: review
    sql: "select (select count(*) from gold.identity_review_queue), (select count(*) from gold.identity_review_queue) + (select count(*) from identity.accepted_links)"
    evidence: "select string_agg(reason || ' ' || n, ', ' order by n desc) from (select reason, count(*) n from gold.identity_review_queue group by 1)"
    how: "Total is all pairs proposed (accepted links plus queued pairs). `grey_zone_no_llm`: Splink scored 0.80-0.95, or above 0.95 but failed the family guard, and the LLM second opinion has not been run (no credentials); with an LLM, only the pairs it disagrees with stay here. `ambiguous` and `splink_ambiguous`: one record fits two different people. `cluster_conflict` and `blocked_conflict`: the link would join two national IDs or clearly different dates of birth."
  - id: I4
    area: identity
    title: "More people than the bank's stated 1,000,000 customers"
    tables: [c360_customer]
    severity: low
    status: documented
    sql: "select greatest(count(*) - 1000000, 0), count(*) from gold.c360_customer"
    evidence: "select count(*) filter (where source_systems not like '%crm%') || ' people have no CRM record (' || count(*) filter (where source_systems = 'bureau') || ' of them bureau only); ' || count(*) filter (where source_systems like '%crm%') || ' people have one' from gold.c360_customer"
    how: "The release states 1,000,000 customers. The excess is people built from records that matched no CRM record (I1, I2), mostly bureau files. It shrinks as review decisions and the LLM second opinion link them."
  - id: I5
    area: identity
    title: "Collections case names a different customer than the holder of the accounts it lists"
    tables: [collections_cases, case_customer]
    severity: high
    status: resolved
    sql: "select count(*) filter (where case_customer_mismatch), count(*) from gold.case_customer"
    evidence: "select count(*) || ' of these cases have the two customers in different provinces; the case''s own province matches the account holder in ' || count(*) filter (where c.province_code = h.province) || ' and the named customer in ' || count(*) filter (where c.province_code = n.province_code) from gold.case_customer cc join curated.collections_cases c using (case_id) join curated.customers_current n on n.crm_customer_id = cc.named_crm_customer_id join gold.c360_customer h on h.golden_customer_id = cc.golden_customer_id where cc.case_customer_mismatch and n.province_code <> h.province"
    how: "Two different, real customers; they are never merged. The CRM IDs differ by one character in every such case and the province points to the account holder, so the case's CRM ID is almost certainly mistyped (an inference, not proven). `gold.case_customer` keeps both readings and resolves the case to the account holder; promises, contacts and notes on the case follow it, and the case's safety flags reach both people. Promises copy the same CRM ID, so joining on `crm_customer_id` alone attaches them to the wrong person."
  - id: I6
    area: identity
    title: "Collections case whose CRM ID does not exist, tied to a person through its accounts"
    tables: [collections_cases, case_customer]
    severity: medium
    status: resolved
    sql: "select count(*) filter (where named_customer_missing and golden_customer_id is not null), count(*) from gold.case_customer"
    how: "The missing CRM IDs (R1) cannot be repaired, but the case lists its accounts and the accounts have a matched holder, so the case gets that person's golden ID (`gold.case_customer.resolved_by = 'account_holder'`)."
  - id: I7
    area: identity
    title: "Collections case that could not be tied to any person"
    tables: [collections_cases, case_customer]
    severity: low
    status: flagged
    sql: "select count(*) filter (where golden_customer_id is null), count(*) from gold.case_customer"
    how: "Its CRM ID does not exist and its accounts are not found. `gold.case_customer.golden_customer_id` is NULL; these cases appear in no customer view."
  - id: I8
    area: identity
    title: "Promise to pay with no owner"
    tables: [promises_to_pay, promises_enriched]
    severity: low
    status: flagged
    sql: "select count(*) filter (where golden_customer_id is null), count(*) from gold.promises_enriched"
    how: "Its case could not be tied to a person (I7) and its CRM ID does not exist. Kept in `gold.promises_enriched` with a NULL `golden_customer_id`; training and features should leave it out."

  # ------------------------------------------------------------------ H. unusual days (anomaly detection)
  # Read curated._anomaly_episodes, written by `python -m trustissues.factory.quality.anomaly` (config/anomaly.yaml).
  # Full list: reports/anomaly_report.md.
  - id: A1
    area: anomaly
    title: "Unusual day or run of days that nothing in the operations log or the calendar explains"
    tables: [contact_history, collections_cases, promises_to_pay, agent_notes, offers, transactions, external]
    severity: medium
    status: documented
    sql: "select (select count(*) from curated._anomaly_episodes where status = 'unexplained'), (select count(*) from curated._anomaly_episodes)"
    evidence: "select string_agg(series || ' ' || slice || ' ' || metric || ' ' || start || (case when days > 1 then ' to ' || \"end\" else '' end) || ' (' || case when metric = 'row_count' then printf('%+.0f%%', change * 100) else printf('%+.0f pts', change * 100) end || ')', '; ') from (select * from curated._anomaly_episodes where status = 'unexplained' order by abs(worst_z) * days desc limit 6)"
    how: "Total is all episodes found. These are leads, not proven defects: the operations log does not list every issue (the release says finding them is part of the task), and some will be business changes the log does not record (a campaign, a new channel). Each needs a person to look before anything is changed. Counted per episode: consecutive flagged days of one metric moving the same way."
  - id: A2
    area: anomaly
    title: "Unusual days explained by a logged operations event"
    tables: [contact_history, collections_cases, external]
    severity: info
    status: context
    sql: "select (select count(*) from curated._anomaly_episodes where status = 'explained'), (select count(*) from curated._anomaly_episodes)"
    evidence: "select string_agg(distinct split_part(explained_by, ' (', 1), ', ') from curated._anomaly_episodes where status = 'explained'"
    how: "Detected automatically and matched to the operations log: the event lists the table and its dates overlap the episode (one day of lag allowed). Long events (layoffs, a policy) explain volume changes only. Section A checks each logged event directly."
  - id: A3
    area: anomaly
    title: "Unusual days explained by the calendar (statutory holidays, monthly billing and benefit cycles)"
    tables: [contact_history, collections_cases, transactions]
    severity: info
    status: context
    sql: "select (select count(*) from curated._anomaly_episodes where status in ('calendar', 'recurring')), (select count(*) from curated._anomaly_episodes)"
    how: "A holiday empties the outbound queues; card cases open on statement-cycle days and benefits arrive on fixed days every month. An episode on a statutory holiday, or repeating at the same point of the month in three or more other months, is labelled and not alerted."

# Code columns checked against the bank's reference lists (curated.code_lookups). dq_report expands each entry into a
# check "values missing from the list or inactive" (area F), plus one summary check of codes used before their
# list's effective_from. `date` is the record's own date. Columns with no reference list at all are listed in
# `code_columns_without_list`.
code_checks:
  - {id: V1, table: curated.card_accounts, column: block_code, code_type: block_code, date: block_date}
  - {id: V2, table: curated.card_accounts, column: product_code, code_type: product_code, date: open_date}
  - {id: V3, table: curated.collections_cases, column: strategy_code, code_type: strategy_code, date: case_open_date}
  - {id: V4, table: curated.collections_cases, column: contact_rule_set, code_type: contact_rule_set, date: case_open_date}
  - id: V5
    table: curated.case_assignment_history
    column: routing_rule_id
    code_type: routing_rule
    date: assigned_ts
    how: "The four unknown codes are a third version of listed rules (`RR-EARLY-03`, `RR-MID-03`, `RR-LATE-03`, `RR-REC-03`, next to the listed `-01` and `-02`): most likely new rules nobody added to the list. Nothing to repair, the routing still happened. Code that explains an assignment by its rule cannot describe these until the list's owner adds them."
  - {id: V6, table: curated.contact_history, column: outcome_code, code_type: outcome_code, date: contact_ts_utc}
  - {id: V7, table: curated.contact_history, column: sub_outcome_code, code_type: outcome_code, date: contact_ts_utc}
  - {id: V8, table: curated.contact_history, column: strategy_code, code_type: strategy_code, date: contact_ts_utc}
  - {id: V9, table: curated.contact_history, column: script_id, code_type: script, date: contact_ts_utc}
  - {id: V10, table: curated.contact_history, column: sms_template_id, code_type: sms_template, date: contact_ts_utc}
  - {id: V11, table: curated.contact_history, column: email_template_id, code_type: email_template, date: contact_ts_utc}
  - {id: V12, table: curated.external, column: score_reason_code_1, code_type: bureau_reason, date: pull_date}
  - {id: V13, table: curated.external, column: score_reason_code_2, code_type: bureau_reason, date: pull_date}
  - {id: V14, table: curated.external, column: score_reason_code_3, code_type: bureau_reason, date: pull_date}
  - {id: V15, table: curated.external, column: score_reason_code_4, code_type: bureau_reason, date: pull_date}

code_columns_without_list:   # code-like columns whose values have no published reference list
  - curated.loan_accounts.product_code
  - curated.deposit_accounts.product_code
  - curated.contact_history.letter_template_id
  - curated.contact_history.push_template_id
  - curated.agent_notes.template_id
  - curated.collections_cases.queue

clean_checks:   # checks that found nothing; listed so the coverage is visible
  - {id: C23, title: "Postal code still invalid after cleaning (customers, cards, loans, deposits)", sql: "select (select count(*) filter (where postal_code_raw is not null and trim(postal_code_raw) <> '' and std_postal is null) from curated.customers) + (select count(*) filter (where cardholder_postal_raw is not null and trim(cardholder_postal_raw) <> '' and std_postal is null) from curated.card_accounts) + (select count(*) filter (where borrower_postal_raw is not null and trim(borrower_postal_raw) <> '' and std_postal is null) from curated.loan_accounts) + (select count(*) filter (where holder_postal_raw is not null and trim(holder_postal_raw) <> '' and std_postal is null) from curated.deposit_accounts), (select count(*) from curated.customers) + (select count(*) from curated.card_accounts) + (select count(*) from curated.loan_accounts) + (select count(*) from curated.deposit_accounts)"}
  - {id: C21, title: "Date of birth still ambiguous after resolution (customers, cards, loans, deposits, bureau)", sql: "select (select count(*) filter (where std_dob_ambiguous) from curated.customers) + (select count(*) filter (where std_dob_ambiguous) from curated.card_accounts) + (select count(*) filter (where std_dob_ambiguous) from curated.loan_accounts) + (select count(*) filter (where std_dob_ambiguous) from curated.deposit_accounts) + (select count(*) filter (where std_dob_ambiguous) from curated.external), (select count(*) from curated.customers) + (select count(*) from curated.card_accounts) + (select count(*) from curated.loan_accounts) + (select count(*) from curated.deposit_accounts) + (select count(*) from curated.external)"}
  - {id: C22, title: "CRM date_of_birth disagrees with the only possible reading of dob_raw", sql: "select count(*) filter (where date_of_birth is distinct from reading), count(*) from (select date_of_birth, case when try_cast(split_part(dob_raw, '/', 1) as int) > 12 then try_strptime(dob_raw, '%d/%m/%Y')::date else try_strptime(dob_raw, '%m/%d/%Y')::date end as reading from curated.customers where regexp_matches(dob_raw, '^[0-9]{2}/[0-9]{2}/[0-9]{4}$') and date_of_birth is not null and (try_cast(split_part(dob_raw, '/', 1) as int) > 12 or try_cast(split_part(dob_raw, '/', 2) as int) > 12))"}
  - {id: C1, title: "Exact duplicate rows removed (all tables)", sql: "select coalesce(sum(dupes_removed), 0), coalesce(sum(raw_rows), 0) from curated._build_log"}
  - {id: C2, title: "Customer date of birth in the future, or age under 18 or over 110", table: curated.customers, where: "std_dob is not null and (cast(std_dob as date) > date '{as_of}' or date_diff('year', cast(std_dob as date), date '{as_of}') < 18 or date_diff('year', cast(std_dob as date), date '{as_of}') > 110)"}
  - {id: C3, title: "Customer stored age differs from age computed from date of birth by more than 1 year", table: curated.customers, where: "age is not null and date_of_birth is not null and abs(age - date_diff('year', date_of_birth, date '{as_of}')) > 1"}
  - {id: C4, title: "Customer relationship starts before date of birth", table: curated.customers, where: "customer_since_date < date_of_birth"}
  - {id: C5, title: "Customer tenure disagrees with relationship start by more than 2 months", table: curated.customers, where: "tenure_months is not null and customer_since_date is not null and abs(tenure_months - date_diff('month', customer_since_date, date '{as_of}')) > 2"}
  - {id: C6, title: "Cease-contact, deceased or bankruptcy flag set with no matching date", table: curated.customers, where: "(cease_communication_flag and cease_communication_date is null) or (deceased_flag and deceased_notified_date is null) or (bankruptcy_flag and insolvency_filed_date is null)"}
  - {id: C7, title: "Declared income zero, negative or over 5,000,000", table: curated.customers, where: "declared_annual_income <= 0 or declared_annual_income > 5000000"}
  - {id: C8, title: "CRM record created after its extract time", table: curated.customers, where: "record_created_ts > extract_ts"}
  - {id: C9, title: "Duplicate primary keys in the four identity tables", sql: "select (select count(*) - count(distinct crm_customer_id) from curated.customers) + (select count(*) - count(distinct card_account_id) from curated.card_accounts) + (select count(*) - count(distinct loan_id) from curated.loan_accounts) + (select count(*) - count(distinct deposit_account_id) from curated.deposit_accounts), (select count(*) from curated.customers)"}
  - {id: C10, title: "Card account opened after its snapshot date", table: curated.card_accounts, where: "open_date > snapshot_date"}
  - {id: C11, title: "Loan matures before it was originated", table: curated.loan_accounts, where: "maturity_date < origination_date"}
  - {id: C12, title: "Loan balance above original amount, or interest rate outside 0 to 40", table: curated.loan_accounts, where: "principal_balance > original_amount * 1.001 or interest_rate < 0 or interest_rate > 40"}
  - {id: C13, title: "Deposit account opened after its snapshot date", table: curated.deposit_accounts, where: "open_date > snapshot_date"}
  - {id: C14, title: "Case status dated before the case opened", table: curated.collections_cases, where: "case_status_date < case_open_date"}
  - {id: C15, title: "Promise due date before it was created, non-positive amount, or paid before created", table: curated.promises_to_pay, where: "ptp_due_date < cast(ptp_created_ts as date) or ptp_amount <= 0 or paid_date < cast(ptp_created_ts as date)"}
  - {id: C16, title: "Call ends before it starts, duration off by more than 5 s, or talk ratios above 1.05", table: curated.call_transcripts, where: "call_end_ts < call_start_ts or abs(duration_sec - date_diff('second', call_start_ts, call_end_ts)) > 5 or customer_talk_ratio + agent_talk_ratio > 1.05"}
  - {id: C17, title: "Contact dated after the as-of date", table: curated.contact_history, where: "contact_ts_utc > date '{as_of}' + 1"}
  - {id: C18, title: "Bureau pull dated after the as-of date, or negative balances and counts", table: curated.external, where: "pull_date > date '{as_of}' or total_balance_all_trades < 0 or collection_items_count < 0 or judgment_count < 0"}
  - {id: C19, title: "Bureau score outside 300 to 900", table: curated.external, where: "risk_score < 300 or risk_score > 900"}
  - {id: C20, title: "Contact reference codes (strategy, outcome, templates, scripts) not in the reference table", sql: "select count(*) filter (where outcome_code is not null and outcome_code not in (select code from curated.code_lookups where code_type = 'outcome_code')) + count(*) filter (where strategy_code is not null and strategy_code not in (select code from curated.code_lookups where code_type = 'strategy_code')), count(*) from curated.contact_history"}
