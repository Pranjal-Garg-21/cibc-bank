[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustissues"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pyyaml", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest"]
p3 = ["lightgbm", "shap", "scikit-learn", "pandas", "pyarrow", "feast"]

[project.scripts]
ti-load-raw = "trustissues.factory.ingest.load_raw:main"
ti-dictionary = "trustissues.factory.ingest.dictionary:main"

[tool.setuptools.packages.find]
where = ["src"]
